# Host build and end-to-end test against the mock RomM server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # sigil and its tiny-AES-c; sigil's libchdr isn't built (Makefile).
      - run: git submodule update --init third_party/sigil && git -C third_party/sigil submodule update --init third_party/tiny-AES-c
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev
      - run: make host tools
      - run: tests/e2e.sh
      - run: tests/autostart.sh
